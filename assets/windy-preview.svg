<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070a14"/>
      <stop offset="50%" stop-color="#0c1222"/>
      <stop offset="100%" stop-color="#080c16"/>
    </linearGradient>

    <!-- Globe Atmoshpere Glow -->
    <radialGradient id="globeAtmosphere" cx="50%" cy="50%" r="50%">
      <stop offset="65%" stop-color="#1e293b" stop-opacity="0"/>
      <stop offset="88%" stop-color="#0284c7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8"/>
    </radialGradient>

    <!-- Globe Surface Gradient -->
    <radialGradient id="globeBody" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="45%" stop-color="#0f1f38"/>
      <stop offset="85%" stop-color="#060c18"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>

    <!-- Streamline Gradients -->
    <linearGradient id="streamGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="streamGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0"/>
      <stop offset="40%" stop-color="#10b981" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#06b6d4" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="sparklineGrad" x1="0" y1="0" x2="0" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Glass Highlights -->
    <linearGradient id="glassBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Canvas Base -->
  <rect width="800" height="500" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Ambient Light Nebula in Center -->
  <circle cx="410" cy="250" r="220" fill="#0284c7" opacity="0.12" filter="url(#softGlow)"/>
  <circle cx="500" cy="210" r="160" fill="#818cf8" opacity="0.08" filter="url(#softGlow)"/>

  <!-- 3D Earth Globe Model -->
  <g transform="translate(410, 250)">
    <!-- Globe Atmosphere halo -->
    <circle cx="0" cy="0" r="162" fill="url(#globeAtmosphere)"/>
    <!-- Globe Body -->
    <circle cx="0" cy="0" r="156" fill="url(#globeBody)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5"/>

    <!-- Stylized Continents (South America Focus) -->
    <!-- South America Shape -->
    <path d="M-10,-95 Q10,-70 25,-40 Q35,-10 20,30 Q10,75 -5,115 Q-15,100 -20,60 Q-45,10 -35,-30 Q-25,-70 -10,-95 Z" 
          fill="#1e40af" opacity="0.45" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>
    <!-- Central America & Caribbean tip -->
    <path d="M-40,-100 Q-25,-90 -15,-92 Q-20,-115 -35,-125 Z" 
          fill="#1e40af" opacity="0.4" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
    <!-- Brazil Coastal Highlight -->
    <path d="M5,-50 Q28,-30 22,10 Q12,50 -2,85" 
          stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.8" filter="url(#softGlow)"/>

    <!-- Amazon "Flying Rivers" Streamlines (Rios Voadores) -->
    <path d="M20,-45 Q-15,-30 -30,0 Q-35,35 5,55" 
          stroke="url(#streamGrad2)" stroke-width="3.5" fill="none" stroke-linecap="round" filter="url(#softGlow)"/>
    <path d="M28,-40 Q-8,-22 -22,10 Q-25,42 12,65" 
          stroke="url(#streamGrad2)" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M35,-35 Q-2,-15 -14,20 Q-15,50 20,72" 
          stroke="url(#streamGrad2)" stroke-width="1.5" stroke-dasharray="4 4" fill="none" opacity="0.9"/>

    <!-- Global Wind Particles / Vector Arcs -->
    <path d="M-130,-40 Q-90,-100 20,-120 Q110,-100 135,-30" 
          stroke="url(#streamGrad1)" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M-140,20 Q-100,100 0,130 Q100,110 142,40" 
          stroke="url(#streamGrad1)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.85"/>
    <path d="M-110,60 Q-40,110 60,110 Q120,80 145,20" 
          stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="6 6" fill="none" opacity="0.6"/>

    <!-- Lightning Storm Pulse in Brazil Center -->
    <circle cx="-5" cy="5" r="4" fill="#facc15" filter="url(#softGlow)"/>
    <circle cx="-5" cy="5" r="14" stroke="#facc15" stroke-width="1" fill="none" opacity="0.6"/>
    <path d="M-7,-2 L-4,5 L-8,6 L-3,13" stroke="#fef08a" stroke-width="1.5" fill="none"/>

    <!-- Latitude / Longitude Curvature Rings -->
    <ellipse cx="0" cy="0" rx="156" ry="60" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <ellipse cx="0" cy="0" rx="156" ry="110" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <ellipse cx="0" cy="0" rx="60" ry="156" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  </g>

  <!-- TOP BAR OVERLAY (Apple Glassmorphic Style) -->
  <g transform="translate(24, 20)">
    <!-- Glass Background Pill -->
    <rect width="752" height="48" rx="14" fill="#0f172a" fill-opacity="0.65" stroke="url(#glassBorder)" stroke-width="1"/>
    
    <!-- Logo -->
    <text x="20" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffffff">
      🌪️ windy<tspan fill="#38bdf8" font-size="12" font-weight="800">3D</tspan>
    </text>

    <!-- Search pill -->
    <rect x="130" y="10" width="230" height="28" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="rgba(255,255,255,0.08)"/>
    <text x="145" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">🔍 Buscar cidade (ex: São Paulo)</text>

    <!-- Model Status Badge -->
    <rect x="520" y="11" width="86" height="26" rx="13" fill="#0369a1" fill-opacity="0.3" stroke="#0284c7" stroke-width="1"/>
    <circle cx="532" cy="24" r="3.5" fill="#38bdf8"/>
    <text x="542" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">ECMWF 9km</text>

    <!-- WebGL Badge -->
    <rect x="618" y="11" width="118" height="26" rx="13" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
    <circle cx="630" cy="24" r="3.5" fill="#34d399"/>
    <text x="640" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#34d399">WebGL 60 FPS</text>
  </g>

  <!-- LEFT HUD: WEATHER LAYERS DOCK -->
  <g transform="translate(24, 88)" filter="url(#cardShadow)">
    <rect width="180" height="260" rx="18" fill="#090e1a" fill-opacity="0.8" stroke="url(#glassBorder)" stroke-width="1"/>
    
    <text x="16" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1">CAMADAS ATIVAS</text>

    <!-- Active Item: Ventos & Rios Voadores -->
    <rect x="10" y="42" width="160" height="38" rx="10" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1"/>
    <text x="22" y="66" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#ffffff">💨 Rios Voadores</text>
    <circle cx="154" cy="61" r="3" fill="#38bdf8"/>

    <!-- Layer 2: Precipitação Radar -->
    <rect x="10" y="86" width="160" height="34" rx="10" fill="#1e293b" fill-opacity="0.3"/>
    <text x="22" y="108" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">🌧️ Chuva Volumétrica</text>

    <!-- Layer 3: Raios & Tempestades -->
    <rect x="10" y="126" width="160" height="34" rx="10" fill="#1e293b" fill-opacity="0.3"/>
    <text x="22" y="148" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">⚡ Descargas / Raios</text>

    <!-- Layer 4: Heatmap Temperatura -->
    <rect x="10" y="166" width="160" height="34" rx="10" fill="#1e293b" fill-opacity="0.3"/>
    <text x="22" y="188" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">🌡️ Mapa Térmico</text>

    <!-- Mini stats footer in dock -->
    <line x1="16" y1="214" x2="164" y2="214" stroke="rgba(255,255,255,0.08)"/>
    <text x="16" y="238" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#64748b">Lat: -23.96° | Lon: -46.33°</text>
  </g>

  <!-- RIGHT FLOATING CARD: CITY SPARKLINE WIDGET -->
  <g transform="translate(560, 88)" filter="url(#cardShadow)">
    <rect width="216" height="200" rx="18" fill="#090e1a" fill-opacity="0.85" stroke="url(#glassBorder)" stroke-width="1"/>
    
    <text x="18" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#ffffff">São Paulo, BR</text>
    <text x="18" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">Tempo Real • ECMWF</text>
    
    <!-- Big Temp -->
    <text x="18" y="84" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="34" font-weight="300" fill="#f8fafc">24°<tspan font-size="18" fill="#38bdf8">C</tspan></text>
    <text x="100" y="74" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">Vento: 18 km/h</text>
    <text x="100" y="90" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">Umidade: 78%</text>

    <!-- Sparkline 24h Area Chart -->
    <path d="M18,150 Q45,130 75,140 T135,120 T198,135 L198,165 L18,165 Z" fill="url(#sparklineGrad)"/>
    <path d="M18,150 Q45,130 75,140 T135,120 T198,135" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round"/>
    
    <!-- Sparkline point dot -->
    <circle cx="135" cy="120" r="4" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" filter="url(#softGlow)"/>

    <text x="18" y="184" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#64748b">Tendência de temperatura próx. 24h</text>
  </g>

  <!-- BOTTOM TIMELINE DOCK (Apple QuickTime/Keynote Style) -->
  <g transform="translate(160, 420)">
    <rect width="480" height="52" rx="16" fill="#0f172a" fill-opacity="0.8" stroke="url(#glassBorder)" stroke-width="1" filter="url(#cardShadow)"/>
    
    <!-- Play button -->
    <circle cx="34" cy="26" r="14" fill="#38bdf8"/>
    <polygon points="31,20 40,26 31,32" fill="#0f172a"/>

    <!-- Timeline track -->
    <line x1="68" y1="26" x2="445" y2="26" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <line x1="68" y1="26" x2="220" y2="26" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <!-- Scrubber head -->
    <circle cx="220" cy="26" r="8" fill="#ffffff" filter="url(#softGlow)"/>

    <!-- Step ticks -->
    <text x="70" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#94a3b8">Agora</text>
    <text x="150" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#94a3b8">+6h</text>
    <text x="210" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700" fill="#38bdf8">+12h</text>
    <text x="310" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#94a3b8">+24h</text>
    <text x="420" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#94a3b8">+72h</text>
  </g>
</svg>
