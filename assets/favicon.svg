<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Squircle Base -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="#0d1117" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <!-- Ambient glow circle -->
  <circle cx="32" cy="32" r="18" fill="url(#favGrad)" opacity="0.25" filter="url(#glow)"/>
  <!-- Minimalist Monogram: V & L geometric fusion -->
  <path d="M19 22L32 44L45 22" stroke="url(#favGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="32" cy="27" r="3" fill="#38bdf8"/>
</svg>
