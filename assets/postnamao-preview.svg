<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="pBg" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="50%" stop-color="#120e24"/>
      <stop offset="100%" stop-color="#0a0d18"/>
    </linearGradient>

    <!-- Glass Highlights & Borders -->
    <linearGradient id="pGlassBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>

    <!-- AI Magic Gradient -->
    <linearGradient id="aiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Post Photo Gradient Mockup -->
    <linearGradient id="photoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="40%" stop-color="#312e81"/>
      <stop offset="80%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <radialGradient id="sunGlow" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fcd34d" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#312e81" stop-opacity="0"/>
    </radialGradient>

    <filter id="pGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="pShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="800" height="500" rx="24" fill="url(#pBg)"/>

  <!-- Ambient AI Studio Glow Orbs -->
  <circle cx="560" cy="220" r="240" fill="#a855f7" opacity="0.14" filter="url(#pGlow)"/>
  <circle cx="260" cy="340" r="200" fill="#ec4899" opacity="0.09" filter="url(#pGlow)"/>
  <circle cx="680" cy="380" r="160" fill="#38bdf8" opacity="0.1" filter="url(#pGlow)"/>

  <!-- Subtle UI Grid Pattern -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="125" x2="800" y2="125"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="266" y1="0" x2="266" y2="500"/>
    <line x1="533" y1="0" x2="533" y2="500"/>
  </g>

  <!-- TOP HEADER (Webapp Brand & Studio Status) -->
  <g transform="translate(24, 20)">
    <rect width="752" height="48" rx="14" fill="#131127" fill-opacity="0.75" stroke="url(#pGlassBorder)" stroke-width="1"/>
    
    <text x="20" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffffff">
      📱 Post Na Mão <tspan fill="#a855f7" font-size="12" font-weight="800">IA</tspan>
    </text>

    <!-- Google AI Studio Badge -->
    <rect x="180" y="10" width="170" height="28" rx="14" fill="url(#aiGradient)" fill-opacity="0.15" stroke="#ec4899" stroke-width="1"/>
    <text x="194" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#f472b6">✨ Google AI Studio Engine</text>

    <!-- Templates Count -->
    <rect x="520" y="11" width="105" height="26" rx="13" fill="#1e1b4b" stroke="rgba(255,255,255,0.1)"/>
    <text x="532" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#c084fc">🎨 5 Templates</text>

    <!-- Status -->
    <rect x="635" y="11" width="105" height="26" rx="13" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
    <circle cx="646" cy="24" r="3.5" fill="#34d399"/>
    <text x="655" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#34d399">Tempo Real</text>
  </g>

  <!-- LEFT COLUMN: GENERATOR CONTROLS (Corretor Flow) -->
  <g transform="translate(24, 86)" filter="url(#pShadow)">
    <rect width="320" height="390" rx="20" fill="#0d0d1a" fill-opacity="0.88" stroke="url(#pGlassBorder)" stroke-width="1"/>

    <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="0.5">DADOS DO IMÓVEL (INSTANTÂNEO)</text>

    <!-- Input 1: Título / Tipologia -->
    <text x="20" y="60" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#cbd5e1">Tipo de Imóvel</text>
    <rect x="20" y="68" width="280" height="34" rx="8" fill="#181829" stroke="#334155" stroke-width="1"/>
    <text x="32" y="90" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500" fill="#f8fafc">Apartamento Alto Padrão</text>

    <!-- Input 2: Preço & Bairro em Grid -->
    <text x="20" y="122" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#cbd5e1">Valor (R$)</text>
    <rect x="20" y="130" width="132" height="34" rx="8" fill="#181829" stroke="#a855f7" stroke-width="1.2"/>
    <text x="32" y="152" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#c084fc">R$ 1.850.000</text>

    <text x="168" y="122" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#cbd5e1">Localização</text>
    <rect x="168" y="130" width="132" height="34" rx="8" fill="#181829" stroke="#334155" stroke-width="1"/>
    <text x="180" y="152" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#f8fafc">Gonzaga, Santos</text>

    <!-- Input 3: Chips de Especificação -->
    <text x="20" y="186" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#cbd5e1">Atributos Rápidos</text>
    <g transform="translate(20, 194)">
      <!-- Chip 1 -->
      <rect x="0" y="0" width="85" height="28" rx="14" fill="#a855f7" fill-opacity="0.2" stroke="#a855f7" stroke-width="1"/>
      <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#e9d5ff">🛏️ 3 Suítes</text>
      <!-- Chip 2 -->
      <rect x="94" y="0" width="85" height="28" rx="14" fill="#a855f7" fill-opacity="0.2" stroke="#a855f7" stroke-width="1"/>
      <text x="106" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#e9d5ff">🚗 2 Vagas</text>
      <!-- Chip 3 -->
      <rect x="188" y="0" width="92" height="28" rx="14" fill="#a855f7" fill-opacity="0.2" stroke="#a855f7" stroke-width="1"/>
      <text x="200" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#e9d5ff">🌊 Vista Mar</text>
    </g>

    <!-- AI Prompt Copywriter Card -->
    <rect x="20" y="242" width="280" height="80" rx="12" fill="url(#aiGradient)" fill-opacity="0.1" stroke="url(#aiGradient)" stroke-width="1"/>
    <text x="32" y="262" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#f472b6">✨ COPYWRITING GERADO POR IA:</text>
    <text x="32" y="282" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#f1f5f9" line-height="1.4">
      "Acorde todos os dias com a brisa do Gonzaga.
    </text>
    <text x="32" y="298" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#f1f5f9">
      3 suítes impecáveis com acabamento de alto padrão..."
    </text>
    <text x="32" y="314" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#a855f7">#imoveisdeluxo #santos #altopadrao</text>

    <!-- Main Instant Action -->
    <rect x="20" y="338" width="280" height="38" rx="10" fill="url(#aiGradient)"/>
    <text x="96" y="362" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#ffffff">⚡ Exportar para Instagram</text>
  </g>

  <!-- RIGHT COLUMN: LIVE HIGH-END INSTAGRAM ART PREVIEW (Result) -->
  <g transform="translate(374, 86)" filter="url(#pShadow)">
    <!-- Simulated Phone / Feed Card -->
    <rect width="402" height="390" rx="20" fill="#0b0b14" stroke="url(#pGlassBorder)" stroke-width="1.5"/>

    <!-- Feed Header -->
    <g transform="translate(18, 14)">
      <circle cx="16" cy="16" r="16" fill="url(#aiGradient)"/>
      <text x="11" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#ffffff">VL</text>
      <text x="40" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#ffffff">ledesma.imoveis</text>
      <text x="40" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#94a3b8">Patrocinado • Santos, SP</text>
      <text x="345" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" fill="#94a3b8">•••</text>
    </g>

    <!-- The Generated Luxury Post Canvas (1:1 Ratio Styled) -->
    <g transform="translate(18, 54)">
      <rect width="366" height="268" rx="14" fill="url(#photoGrad)"/>
      
      <!-- Architectural Modernist Building Illustration -->
      <path d="M40,268 L40,110 L160,50 L280,100 L280,268 Z" fill="#0f172a" opacity="0.6"/>
      <!-- Sun flare -->
      <circle cx="280" cy="70" r="120" fill="url(#sunGlow)"/>
      <!-- Glass facade panels -->
      <rect x="60" y="120" width="80" height="148" rx="6" fill="#38bdf8" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1"/>
      <line x1="60" y1="160" x2="140" y2="160" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
      <line x1="60" y1="200" x2="140" y2="200" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>

      <!-- Floating Glass Property Badge (Bottom Left) -->
      <g transform="translate(16, 172)">
        <rect width="334" height="82" rx="12" fill="#090e1a" fill-opacity="0.82" stroke="url(#pGlassBorder)" stroke-width="1"/>
        
        <!-- Category Pill -->
        <rect x="12" y="10" width="112" height="18" rx="9" fill="#a855f7" fill-opacity="0.3"/>
        <text x="20" y="23" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700" fill="#e9d5ff">EXCLUSIVE LISTING</text>

        <!-- Big Price -->
        <text x="12" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="800" fill="#ffffff">R$ 1.850.000</text>
        <text x="12" y="69" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">Gonzaga • Vista Panorâmica</text>

        <!-- Feature Icons -->
        <text x="210" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">3 Suítes</text>
        <text x="270" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">2 Vagas</text>
        <text x="210" y="68" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#64748b">178 m² privativos</text>
      </g>
    </g>

    <!-- Social Action Bar -->
    <g transform="translate(18, 332)">
      <!-- Instagram Heart, Comment, Share, Bookmark -->
      <text x="6" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" fill="#f43f5e">❤️</text>
      <text x="36" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" fill="#94a3b8">💬</text>
      <text x="66" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" fill="#94a3b8">✈️</text>
      <text x="340" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" fill="#94a3b8">🔖</text>
      <text x="6" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" fill="#e2e8f0">482 curtidas • Post gerado em 14 segundos com IA</text>
    </g>
  </g>
</svg>
